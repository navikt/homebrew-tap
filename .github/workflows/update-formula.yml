name: Update cplt formula

on:
  schedule:
    # Check for new releases every hour
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: formula-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Fetch latest cplt release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(gh release list --repo navikt/cplt --json tagName --limit 1 \
            --jq '.[0].tagName')

          if [ -z "$VERSION" ]; then
            echo "No cplt release found"
            exit 0
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest cplt release: $VERSION"

      - name: Check if formula is already up to date
        id: check
        run: |
          CURRENT=$(grep '^  version ' Formula/cplt.rb | sed 's/.*"\(.*\)"/\1/')
          echo "Current: $CURRENT  Latest: ${{ steps.release.outputs.version }}"
          if [ "$CURRENT" = "${{ steps.release.outputs.version }}" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download tarballs and compute SHA256
        if: steps.check.outputs.up_to_date == 'false'
        id: sums
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          BASE="https://github.com/navikt/cplt/releases/download/${VERSION}"
          curl -fsSL "$BASE/cplt-aarch64-apple-darwin.tar.gz" -o mac_arm.tar.gz
          curl -fsSL "$BASE/cplt-x86_64-apple-darwin.tar.gz" -o mac_x86.tar.gz
          curl -fsSL "$BASE/cplt-aarch64-unknown-linux-gnu.tar.gz" -o linux_arm.tar.gz
          curl -fsSL "$BASE/cplt-x86_64-unknown-linux-gnu.tar.gz" -o linux_x86.tar.gz
          echo "mac_arm=$(sha256sum mac_arm.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "mac_x86=$(sha256sum mac_x86.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_arm=$(sha256sum linux_arm.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_x86=$(sha256sum linux_x86.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Write updated formula
        if: steps.check.outputs.up_to_date == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MAC_ARM_SHA: ${{ steps.sums.outputs.mac_arm }}
          MAC_X86_SHA: ${{ steps.sums.outputs.mac_x86 }}
          LINUX_ARM_SHA: ${{ steps.sums.outputs.linux_arm }}
          LINUX_X86_SHA: ${{ steps.sums.outputs.linux_x86 }}
        run: |
          cat > Formula/cplt.rb << FORMULA
          class Cplt < Formula
            desc "Kernel-enforced sandbox wrapper for coding agents"
            homepage "https://github.com/navikt/cplt"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/navikt/cplt/releases/download/${VERSION}/cplt-aarch64-apple-darwin.tar.gz"
                sha256 "${MAC_ARM_SHA}"
              else
                url "https://github.com/navikt/cplt/releases/download/${VERSION}/cplt-x86_64-apple-darwin.tar.gz"
                sha256 "${MAC_X86_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/navikt/cplt/releases/download/${VERSION}/cplt-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_ARM_SHA}"
              else
                url "https://github.com/navikt/cplt/releases/download/${VERSION}/cplt-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_X86_SHA}"
              end
            end

            def install
              bin.install "cplt"
            end

            test do
              assert_match "cplt", shell_output("#{bin}/cplt --version")
            end
          end
          FORMULA

      - name: Commit formula via GitHub API
        if: steps.check.outputs.up_to_date == 'false'
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.release.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const path = 'Formula/cplt.rb';
            const branch = context.ref.replace('refs/heads/', '');
            const content = fs.readFileSync(path, 'base64');
            const message = `chore: update cplt to ${process.env.VERSION}`;

            // The contents API commits as GitHub's web-flow identity, which
            // signs the commit. Plain `git push` from the runner cannot.
            for (let attempt = 1; attempt <= 3; attempt++) {
              const { data: remote } = await github.rest.repos.getContent({
                ...context.repo,
                path,
                ref: branch,
              });
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  ...context.repo,
                  path,
                  branch,
                  message,
                  content,
                  sha: remote.sha,
                });
                core.info(message);
                return;
              } catch (error) {
                if (error.status !== 409) throw error;
                core.warning(
                  `${path} changed on ${branch} during this run ` +
                  `(attempt ${attempt}/3), re-reading its sha and retrying`,
                );
              }
            }
            core.setFailed(`Could not commit ${path} after 3 attempts`);
